name: Firefox Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run verify:version -- "$GITHUB_REF_NAME"

      - name: Type-check
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run build:archive

      - name: Lint extension package
        run: npm run lint:extension

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Upload Firefox package
        uses: actions/upload-artifact@v7
        with:
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          archive: false
